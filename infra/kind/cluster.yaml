# kind 클러스터 정의 — ERP DevOps PoC 개발계
#
# 노드 3대 구성:
#   erp-poc-control-plane  제어 평면
#   erp-poc-worker         워크로드 + Ingress 진입점 (호스트 80/443 매핑)
#   erp-poc-worker2        워크로드
#
# 생성:  scripts/00-bootstrap.sh
# 삭제:  scripts/99-teardown.sh
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: erp-poc

# containerd 가 레지스트리별 설정을 읽도록 경로를 지정한다.
#
# 기본값은 빈 문자열이라 /etc/containerd/certs.d/ 를 아예 보지 않는다.
# 이 값이 없으면 Harbor(Phase 3)에서 이미지를 받아올 수 없다.
#
# 노드 생성 시점에만 적용되므로 나중에 추가하려면 클러스터를 다시 만들어야 한다.
# 반면 이 경로 아래의 hosts.toml 은 요청마다 읽히므로,
# 레지스트리를 추가할 때는 파일만 넣으면 되고 containerd 재시작이 필요 없다.
#   → scripts/30-install-harbor.sh 가 hosts.toml 을 배포한다
containerdConfigPatches:
  - |-
    [plugins.'io.containerd.cri.v1.images'.registry]
      config_path = '/etc/containerd/certs.d'

nodes:
  - role: control-plane
    # 노드 이미지는 digest까지 고정한다.
    # 태그만 쓰면 업스트림이 갱신될 때 재구축 결과가 달라진다.
    # (앱 저장소에서 postgres:latest 가 18로 올라가며 기동 실패했던 것과 같은 유형의 사고)
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5

  # Ingress 전용 워커.
  # 호스트의 80/443 을 이 노드로 직결해 브라우저에서 바로 접근할 수 있게 한다.
  # ingress-nginx 컨트롤러는 nodeSelector(ingress-ready=true)로 이 노드에 고정된다.
  #
  # 제어 평면이 아니라 워커에 두는 이유:
  # 제어 평면에는 node-role.kubernetes.io/control-plane:NoSchedule 테인트가 걸려 있어
  # toleration을 추가로 관리해야 한다. 노드가 3대인 구성에서는 워커를 쓰는 편이 단순하다.
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
