# SonarQube Helm values — kind 로컬 클러스터용
#
# 차트: sonarqube/sonarqube
# 설치: scripts/50-install-sonarqube.sh
#
# 아키텍처 문서 6p 의 "Jenkins 빌드·테스트 · SonarQube 분석" 에 해당한다.
# 12p 라이선스 감사에서 "내부 CI 전용, 재배포 제외" 조건으로 분류된 도구다.
# 파트너사에 배포하지 않고 본사 CI 안에서만 쓰는 한 문제가 없다.

# Community Build — 무료판.
# 브랜치 분석과 PR 데코레이션이 없다. 단일 브랜치 분석에는 지장이 없다.
#
# edition 은 설정하지 않는다. 차트가 'community' 를 유효한 edition 으로 보지 않고,
# community.enabled 로만 지정하도록 요구한다(validation.yaml).
community:
  enabled: true

# 초기 관리자 비밀번호를 바꾼다.
# 기본값(admin/admin)으로 두면 첫 로그인 때 변경을 요구해 CI 가 막힌다.
account:
  adminPassword: "SonarPoC12345!"
  currentAdminPassword: "admin"

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - name: sonarqube.localtest.me
      path: /
  annotations:
    # 분석 결과 업로드는 프로젝트 규모에 따라 수 MB 가 된다.
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"

# 내장 PostgreSQL 을 쓴다.
# 운영에서는 외부 DB 가 권장되지만 로컬 검증에는 과하다.
postgresql:
  enabled: true
  primary:
    persistence:
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    cpu: 200m
    memory: 2Gi
  limits:
    memory: 4Gi

# SonarQube 는 Elasticsearch 를 내장한다.
# 커널 파라미터 vm.max_map_count 가 262144 이상이어야 기동한다.
#
# kind 노드는 Docker Desktop VM 의 커널을 공유하고 그 값이 이미 262144 다.
# 따라서 initContainer 로 다시 설정할 필요가 없고,
# 시도하면 권한 문제로 오히려 기동이 막힌다.
initSysctl:
  enabled: false

initFs:
  enabled: true

# 모니터링 패스코드.
# 차트가 값이 비어 있으면 설치를 거부한다(validation.yaml).
# /api/monitoring/* 접근에만 쓰이며 이 PoC 에서는 호출하지 않는다.
monitoringPasscode: "erp-poc-monitoring"

prometheusExporter:
  enabled: false
