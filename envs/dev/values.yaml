# 개발 환경 값 — charts/eshop 을 이 환경에 맞게 덮어쓴다.
#
# 차트 본체(charts/eshop/values.yaml)는 환경과 무관한 구조와 기본값을 담고,
# 이 파일은 환경에 따라 달라지는 값만 담는다.
#
# ArgoCD 가 이 파일을 함께 읽는다.
#   argocd/applications/eshop-dev.yaml 의 multi-source 설정 참고
#
# ── 이 파일을 고치면 배포된다 ─────────────────────────────────────
# 커밋을 푸시하면 ArgoCD 가 감지해 클러스터에 반영한다.
# kubectl 이나 helm 을 직접 실행할 필요가 없고, 실행해도 selfHeal 이 되돌린다.

global:
  # 이미지를 받아올 레지스트리.
  #
  # Phase 3부터 Harbor 에서 받는다. 이전에는 이 값이 비어 있어
  # kind load 로 노드에 직접 넣은 이미지에 의존했고,
  # 그때는 이미지가 어디서 왔는지 Git 에 아무 기록이 남지 않았다.
  #
  # erp-hq 는 public 프로젝트라 익명 pull 이 된다.
  # 이 저장소가 PUBLIC 이라 pull secret 을 Git 에 둘 수 없어서 택한 방식이다.
  # 자격증명이 필요한 구성은 Phase 8(OpenBao)에서 다룬다.
  imageRegistry: harbor.localtest.me/erp-hq

  # 배포할 이미지 태그.
  #
  # Phase 4에서 CI 가 빌드 후 이 값을 커밋하게 된다.
  # 그때 고쳐야 할 파일이 차트 본체가 아니라 이 파일이어야,
  # 차트 구조 변경과 배포 태그 갱신이 서로 섞이지 않는다.
  imageTag: 117cd245fe80

  # 레지스트리에서 받아오되, 이미 노드에 있으면 다시 받지 않는다.
  #
  # Always 로 두면 태그를 재사용할 때 갱신을 보장할 수 있지만,
  # 이 PoC 는 태그가 고정(local)이라 매번 받을 이유가 없다.
  # Phase 4에서 커밋 해시를 태그로 쓰기 시작하면 태그 자체가 달라지므로
  # IfNotPresent 로도 항상 새 이미지를 받게 된다.
  imagePullPolicy: IfNotPresent

  # 개발 환경이므로 시드 데이터를 생성한다.
  # Catalog 의 상품 6종과 Ordering 의 초기 스키마가 이 값에 걸려 있다.
  aspnetcoreEnvironment: Development

ingress:
  enabled: true
  host: eshop.localtest.me
  gatewayHost: api.eshop.localtest.me

# 개발 환경의 복제본 수.
#
# selfHeal 검증에서 이 값이 기준이 된다.
# kubectl scale 로 늘려도 ArgoCD 가 여기 적힌 수로 되돌린다.
apps:
  catalog-api:
    replicas: 1
  basket-api:
    replicas: 1
  discount-grpc:
    replicas: 1
  ordering-api:
    replicas: 1
  yarp-apigateway:
    replicas: 1
  shopping-web:
    replicas: 1
