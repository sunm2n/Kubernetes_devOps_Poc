{{/*
테넌트 격리 — NetworkPolicy 와 RBAC.

본사(envs/dev)는 이 기능을 끈 채로 둔다. 지금까지의 검증을 그대로 유지하기 위해서다.
파트너사(envs/partner-*)에서 켠다.

같은 차트에 넣은 이유:
격리는 배포와 함께 걸려야 한다. 별도 차트나 수동 적용으로 두면
파트너 네임스페이스는 만들어졌는데 정책은 안 붙은 시점이 생긴다.
그 틈이 존재하는 한 격리를 보장한다고 말할 수 없다.
*/}}
{{- if .Values.tenant.networkPolicy.enabled }}
{{/*
  ── 1. 기본 차단 ──────────────────────────────────────────────

  이 네임스페이스의 모든 파드에 대해 들어오는 것과 나가는 것을 모두 막는다.
  아래 규칙들이 필요한 것만 다시 연다.

  NetworkPolicy 는 더하기만 한다. 규칙이 하나도 없는 정책이 곧 전면 차단이고,
  뒤에 오는 정책들이 허용을 얹는 방식이다. 그래서 이 정책 하나만으로
  "명시하지 않은 것은 막힌다" 가 성립한다.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-default-deny
  labels:
    {{- include "eshop.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
{{/*
  ── 2. 같은 네임스페이스 안 통신 ──────────────────────────────

  서비스끼리는 서로 불러야 한다.
  web → gateway → catalog, basket → discount(gRPC), ordering → orderdb 등.

  namespaceSelector 를 쓰지 않고 podSelector 만 쓰면 "같은 네임스페이스"가 된다.
  파트너 A 의 파드는 파트너 B 를 이 규칙으로 부를 수 없다.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-allow-same-namespace
  labels:
    {{- include "eshop.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
{{/*
  ── 3. DNS ────────────────────────────────────────────────────

  이것이 빠지면 서비스 이름을 못 찾아 전부 멈춘다.
  egress 를 막을 때 가장 먼저 걸리는 항목이고, 증상이
  "이름 해석 실패" 로 나타나 네트워크 정책 문제로 보이지 않는다.

  kube-system 의 CoreDNS 로 나가는 53 번만 연다.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-allow-dns
  labels:
    {{- include "eshop.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
{{/*
  ── 4. Ingress 컨트롤러 ───────────────────────────────────────

  외부에서 파트너 화면에 들어오는 유일한 경로다.
  ingress-nginx 네임스페이스에서 오는 것만 받는다.

  이 규칙이 없으면 파드는 다 뜨는데 브라우저에서 502 가 뜬다.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-allow-ingress-controller
  labels:
    {{- include "eshop.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.tenant.networkPolicy.ingressNamespace }}
{{- end }}

{{- if .Values.tenant.rbac.enabled }}
---
{{/*
  ── 5. 파트너 운영자 계정 ─────────────────────────────────────

  파트너사 담당자가 자기 네임스페이스만 볼 수 있게 한다.

  Role 은 네임스페이스 경계를 넘지 못한다. ClusterRole 을 쓰면
  RoleBinding 으로 묶어도 대상 네임스페이스 안에서만 유효하지만,
  여기서는 권한 범위를 한눈에 보기 위해 Role 로 둔다.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.tenant.rbac.serviceAccountName }}
  labels:
    {{- include "eshop.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.tenant.rbac.serviceAccountName }}
  labels:
    {{- include "eshop.labels" . | nindent 4 }}
rules:
  # 읽기는 자기 네임스페이스 안에서 자유롭게 한다.
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, persistentvolumeclaims, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]

  # 쓰기는 파드 재시작에 필요한 것만 준다.
  #
  # Secret 은 넣지 않는다. 자기 네임스페이스의 것이라도 접속 문자열과
  # 레지스트리 자격증명이 들어 있고, pull secret 을 읽으면
  # 그 계정으로 레지스트리에 직접 붙을 수 있다.
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tenant.rbac.serviceAccountName }}
  labels:
    {{- include "eshop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.tenant.rbac.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tenant.rbac.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
